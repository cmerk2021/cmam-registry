name: index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Validate manifests and generate index.json
        run: go run ./tools/genindex
      - name: Commit index.json if changed
        run: |
          # Stage first: plain `git diff` ignores untracked files, so a brand-new
          # index.json would never be detected as a change.
          git add index.json
          if ! git diff --cached --quiet -- index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: regenerate index.json"
            git push
          else
            echo "index.json is up to date"
          fi
